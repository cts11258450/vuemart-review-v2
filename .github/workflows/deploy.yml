# 顯示在 GitHub Actions 頁面的工作流程名稱
name: Deploy VueMart to GitHub Pages

# 決定什麼時候執行工作流程
on:
  # 每次有 commit 推送到 main 時自動執行
  push:
    branches:
      - main

  # 允許在 GitHub Actions 頁面手動執行
  workflow_dispatch:

# 提供部署 GitHub Pages 所需權限
permissions:
  # 允許讀取 Repository 程式碼
  contents: read

  # 允許部署至 GitHub Pages
  pages: write

  # 允許 GitHub Pages 驗證部署身分
  id-token: write

# 同一時間只執行一個 Pages 部署
concurrency:
  group: pages

  # 新部署開始時，取消尚未完成的舊部署
  cancel-in-progress: true

jobs:
  deploy:
    # 記錄 GitHub Pages 部署環境及正式網址
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # 使用 GitHub 提供的 Ubuntu 虛擬主機
    runs-on: ubuntu-latest

    steps:
      # 取得目前 Repository 的程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 安裝 Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 根據 package-lock.json 安裝固定版本套件
      - name: Install dependencies
        run: npm ci

      # 執行 Vite 正式建置
      - name: Build project
        run: npm run build

      # 初始化 GitHub Pages 部署設定
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # 將 Vite 產生的 dist 上傳為 Pages Artifact
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # 將 Artifact 正式部署至 GitHub Pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4